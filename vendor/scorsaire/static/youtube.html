<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorsaire — YouTube</title>
<style>
  :root { --ui-font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  body { font-family: var(--ui-font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: var(--ui-font); }
  html, body { margin: 0; background: var(--paper, #faf8f4); font: 15px var(--ui-font, sans-serif); color: var(--ink, #1c1b1a); }
  * { box-sizing: border-box; }
  svg { display: block; }
  button { font: inherit; background: #fdfcfa; border: 1px solid #bbb; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: #c9c4b8; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: #5a5750; border: 0; }
</style>
</head>
