<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorsaire</title>
<style>
  /*FONTS*/
  :root { --ink:#1c1b1a; --paper:#faf8f4; --btn:#fdfcfa; --line:#d8d3c8; --bg:#faf8f4; --btn-gap:2px; }
  /* dark theme, after the Luminare mock-up: near-black panels, almost white text, fine lines, gold on what is active; the staff lines are dimmer than the notes */
  html[data-theme="dark"] { --ink:#f6f5f3; --paper:#101012; --bg:#101012; --btn:#2a2b2d; --line:#34343a; --score:#101012; --side-tabs:#0e0e10; --module:#1a1a1d; --row:#242427; --bar:#1a1a1d; --btn-on:#3a3222; --btn-on-line:#caa457; --muted-ink:#5a5852; --edge:#4a4b4f; --accent:#e9cd8d; --accent-soft:#3a3222; --field:#26262a; --ink-soft:#d6d5d1; --ink-faint:#8d90a0; --soft:#202023; --track:#2e2f32; --paper-veil:rgba(19,19,19,.85); --tab-active:#e9cd8d; --primary:#caa457; --primary-ink:#14110a; --warn-soft:#3a3222; --danger-soft:#3d2424; --select:#e9cd8d; --select-edge:#caa457; --range-fill:rgba(202,164,87,.16); --range-edge:#caa457; --desk:#26262a; --field-edge:#7d7d82; --band-factor:.3; --sel-fill:rgba(202,164,87,.16); --sel-edge:#caa457; --sel-hover:transparent; --ok-soft:#3a3222; --ok-edge:#caa457; --info-ink:#e0bf72; --staff-line-opacity:.5; --auto-bg:#1b2230; --auto-border:#40506a; --auto-fader:#8191ab; --auto-curve:#6aa8ff; --auto-mute:#3a4558; --auto-grid:#28324a; --auto-point:#101012; --auto-label:#a9b8d0; --auto-ink:#a9c8ff; --danger-ink:#ff8f85; --ok-ink:#7fd19a; --warn-ink:#e3b05a; }
  /* HIGH CONTRAST (after the logo: black, white, yellow). WCAG 2.2: text 7:1 or more (AAA 1.4.6), borders and graphical parts 3:1 or more (1.4.11), a 3 px focus ring (2.4.7 / 2.4.13),
     meaning never by colour alone (a pressed button also gets a thicker yellow border, 1.4.1). The text weight, contrast level and thin-symbol settings are ignored here. */
  html[data-theme="hc"] { --ink:#fff; --paper:#000; --bg:#000; --btn:#000; --line:#bfbfbf; --score:#000; --side-tabs:#000; --module:#000; --row:#141414; --bar:#000; --btn-on:#3a3000; --btn-on-line:#ffd800; --muted-ink:#9a9a9a; --edge:#fff; --accent:#ffd800; --accent-soft:#3a3000; --field:#000; --ink-soft:#f0f0f0; --ink-faint:#d6d6d6; --soft:#141414; --track:#4a4a4a; --paper-veil:rgba(0,0,0,.94); --tab-active:#ffd800; --primary:#ffd800; --primary-ink:#000; --ok-soft:#003a14; --ok-edge:#7dff9a; --warn-soft:#3a2a00; --danger-soft:#4a0000; --danger-ink:#ff9a9a; --ok-ink:#7dff9a; --info-ink:#ffd800; --warn-ink:#ffc04d; --select:#ffd800; --select-edge:#fff; --range-fill:rgba(255,216,0,.22); --range-edge:#ffd800; --desk:#333; --desk-ink:#fff; --band-factor:0; --sel-fill:rgba(255,216,0,.22); --sel-edge:#ffd800; --sel-hover:rgba(255,216,0,.14); --staff-line-opacity:1; --auto-bg:#000; --auto-border:#fff; --auto-fader:#bfbfbf; --auto-curve:#ffd800; --auto-mute:#4a4a4a; --auto-grid:#333; --auto-point:#000; --auto-label:#fff; --auto-ink:#ffd800; }
  /* the text / symbol / staff-line settings are for the SCREEN only: nothing of them reaches a printout (the print page has its own colours and weights) */
  @media screen {
  /* on a dark page EVERYTHING that marks a part of the form or a finger is white: the cards (outline and name; the small dot too), the finger dots of the chord diagrams (white, their number black) and the open-string rings (light) */
  html[data-dark] [data-role="section-card"] { fill: #fff; fill-opacity: .14; stroke: rgba(255,255,255,.85); stroke-width: 1; }
  html[data-dark] [data-role="section-card"] + text, html[data-dark] [data-role="section-card-text"] { fill: #fff; }
  html[data-dark] .sheet-seccard { color: #fff !important; border-color: rgba(255,255,255,.85) !important; }
  html[data-dark] .sheet-seccard > span:first-child { background: #fff !important; }
  html[data-dark] [data-section-card] > span { background: #fff !important; color: #1c1b1a !important; }
  html[data-dark] { --diagram-dot: #fff; --diagram-dot-ink: #000; --diagram-open: #e6e4de; }
  html[data-dark][data-lean="1"]:not([data-hc]) { --w-bold:600; --w-semi:500; }
  html[data-dark][data-lean="2"]:not([data-hc]) { --w-bold:500; --w-semi:400; }
  html[data-dark][data-lean="2"]:not([data-hc]) body { font-weight:350; }
  html[data-dark][data-lean="3"]:not([data-hc]) { --w-bold:450; --w-semi:350; }
  html[data-dark][data-lean="3"]:not([data-hc]) body { font-weight:300; }
  :where(html[data-dark][data-lean="2"]:not([data-hc])) :where(button, input, select, textarea) { font-weight:350; }
  :where(html[data-dark][data-lean="3"]:not([data-hc])) :where(button, input, select, textarea) { font-weight:300; } /* form controls do not inherit the weight of the body; zero specificity: a component that sets its own weight keeps it */
  /* thinner music symbols (setting "Symboles de la partition"): a thin line in the colour of the page eats into the outline of every glyph (not the chord buttons of the accordion) */
  html[data-glyph-fine]:not([data-hc]) svg g[data-glyph]:not([data-role="accordion-name"]) > path { stroke:var(--glyph-erode,var(--score,#fff)); stroke-linejoin:round; }
  html[data-glyph-fine="1"]:not([data-hc]) svg g[data-glyph]:not([data-role="accordion-name"]) > path { stroke-width:4px; }
  html[data-glyph-fine="2"]:not([data-hc]) svg g[data-glyph]:not([data-role="accordion-name"]) > path { stroke-width:8px; }
  svg line[data-role="staff-line"] { stroke-opacity:var(--staff-line-opacity,1); }
  /* contrast levels (button in the page header): 1 soft, 2 normal (nothing to change), 3 strong, 4 maximal; text colours, lines and borders */
  html:not([data-dark])[data-contrast="1"] { --ink:#3a3835; --ink-soft:#6b6760; --ink-faint:#9a958c; --line:#e3dfd5; --edge:#cfcabf; --muted-ink:#c4c0b8; }
  html:not([data-dark])[data-contrast="3"] { --ink:#0c0b0a; --ink-soft:#3a3835; --ink-faint:#5f5b54; --line:#b9b3a6; --edge:#8f897c; --muted-ink:#9c978c; }
  html:not([data-dark])[data-contrast="4"] { --ink:#000; --ink-soft:#1f1e1c; --ink-faint:#44413c; --line:#8a8479; --edge:#5e594f; --muted-ink:#7d786d; --staff-line-opacity:1; }
  html[data-dark][data-contrast="1"]:not([data-hc]) { --ink:#dfdedb; --ink-soft:#b3b2af; --ink-faint:#70737f; --line:#2b2b30; --edge:#3b3c40; --muted-ink:#4a4843; }
  html[data-dark][data-contrast="3"]:not([data-hc]) { --ink:#fdfcf9; --ink-soft:#e6e4de; --ink-faint:#aeb1c0; --line:#4f4f56; --edge:#6a6b70; --muted-ink:#77746d; --staff-line-opacity:.7; }
  html[data-dark][data-contrast="4"]:not([data-hc]) { --ink:#fff; --ink-soft:#f2ede2; --ink-faint:#cfd2de; --line:#7a7a82; --edge:#9a9ba0; --muted-ink:#97948c; --staff-line-opacity:.9; }
  html:not([data-dark])[data-lean-light="1"] { --w-bold:600; --w-semi:500; }
  html:not([data-dark])[data-lean-light="2"] { --w-bold:500; --w-semi:400; }
  html:not([data-dark])[data-lean-light="2"] body { font-weight:350; }
  html:not([data-dark])[data-lean-light="3"] { --w-bold:450; --w-semi:350; }
  html:not([data-dark])[data-lean-light="3"] body { font-weight:300; }
  :where(html:not([data-dark])[data-lean-light="2"]) :where(button, input, select, textarea) { font-weight:350; }
  :where(html:not([data-dark])[data-lean-light="3"]) :where(button, input, select, textarea) { font-weight:300; }
  }
  /* interface font: Inter (embedded, variable weights) on every theme; the setting "Police de l'interface" can bring back the system fonts (data-ui-font="system") */
  html:not([data-ui-font="system"]) { --ui-font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
  html:not([data-ui-font="system"]) body { font-family:var(--ui-font); -webkit-font-smoothing:antialiased; letter-spacing:.005em; }
  :where(html:not([data-ui-font="system"])) :where(button, input, select, textarea) { font-family:var(--ui-font); } /* form controls do not inherit the font either; zero specificity: a component that sets its own font keeps it */
  /* the head of every drop-down menu (a native <select>) looks like the head of Scorsaire's own choice menus (choice-menu.js): rounded, thin border, a small chevron; zero specificity so a component can still size it */
  :where(select) { appearance:none; -webkit-appearance:none; box-sizing:border-box; min-height:var(--ui-target,30px); padding:0 26px 0 10px; border:1px solid var(--edge,#bbb); border-radius:8px; background-color:var(--btn,#fdfcfa); color:inherit; font:inherit; text-overflow:ellipsis;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%); background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  :where(select:disabled) { opacity:.5; }
  @media screen {
    html[data-hc] { --staff-line-opacity:1 !important; }
    html[data-hc] button { border:2px solid #fff; box-shadow:none !important; }
    html[data-hc] button[aria-pressed="true"] { border-color:#ffd800; color:#fff; box-shadow:inset 0 0 0 2px #ffd800 !important; }
    html[data-hc] button:disabled { opacity:1; color:#bfbfbf; border-style:dashed; border-color:#bfbfbf; }
    html[data-hc] :focus-visible { outline:3px solid #ffd800 !important; outline-offset:2px; box-shadow:0 0 0 2px #000; }
    html[data-hc] * { text-shadow:none !important; }
    html[data-hc] input, html[data-hc] select, html[data-hc] textarea { border:2px solid #fff; background:#000; color:#fff; }
    html[data-hc] ::placeholder { color:#d6d6d6; opacity:1; }
    html[data-hc] .ps-sheet { outline:2px solid #fff; }
    html[data-hc] ::selection { background:#ffd800; color:#000; }
  }
  @media (forced-colors: active) { :focus-visible { outline:3px solid Highlight !important; outline-offset:2px; } }
  html[data-theme="dark"] [data-sidebar-bar] { box-shadow:0 1px 0 rgba(255,255,255,.06); }
  html[data-dark] button { border-color:var(--edge,#4a4a52); }
  html[data-dark] button[aria-pressed="true"] { color:var(--ink); }
  html[data-dark] .caption { color:#9a948a; }
  html[data-dark][data-slim-scroll] * { scrollbar-color:#4a4a52 transparent; }
  html[data-dark][data-slim-scroll] *::-webkit-scrollbar-thumb { background:#4a4a52; }
  html[data-dark][data-slim-scroll] *::-webkit-scrollbar-thumb:hover { background:#68686f; }
  html[data-dark] input[type=range] { accent-color:#caa457; }
  html[data-dark] input[type=range]::-webkit-slider-runnable-track { background:#46464d; }
  html[data-dark] input[type=range]::-moz-range-track { background:#46464d; }
  html[data-dark] input[type=range]::-webkit-slider-thumb { background:#caa457; }
  html[data-dark] input[type=range]::-moz-range-thumb { background:#caa457; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 12px; background:var(--paper); color:var(--ink);
         font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; }
  h1 { font-size:1.3rem; font-weight:600; margin:0 0 12px; }
  #score-host { background:var(--score,#fff); border:1px solid var(--line); border-radius:10px; padding:20px; overflow:auto; }
  /* the look of every button (same as the choice menus and the floating bars): white, thin grey outline, rounded corners; the components keep their own states */
  button { background:var(--btn,#fdfcfa); color:inherit; border:1px solid #bbb; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button[aria-pressed="true"] { background:var(--btn-on,#e2e0da); color:#1c1b1a; border-color:var(--btn-on-line,#b9b4a8); }
  /* optional looks (device settings): slim scrollbars and a light relief on buttons */
  html[data-slim-scroll] * { scrollbar-width:thin; scrollbar-color:#b9b4a8 transparent; }
  html[data-slim-scroll] *::-webkit-scrollbar { width:10px; height:10px; }
  html[data-slim-scroll] *::-webkit-scrollbar-track { background:transparent; }
  html[data-slim-scroll] *::-webkit-scrollbar-thumb { background:#c4bfb3; border-radius:6px; border:2px solid transparent; background-clip:content-box; }
  html[data-slim-scroll] *::-webkit-scrollbar-thumb:hover { background:#a39e91; background-clip:content-box; border:2px solid transparent; }
  html[data-btn-relief] button:not(:disabled):not([aria-pressed="true"]):not([role="tab"]):not([data-tab]):not(.tp-name):not([data-sidebar] *) { box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 1px 2px rgba(60,50,30,.16); }
  html[data-btn-relief] button:not(:disabled):not([aria-pressed="true"]):not([role="tab"]):not([data-tab]):not(.tp-name):not([data-sidebar] *):active { box-shadow:inset 0 1px 3px rgba(60,50,30,.12); }
  html[data-btn-relief] button[aria-pressed="true"]:not([role="tab"]):not([data-tab]):not([data-sidebar] *) { box-shadow:inset 0 1px 2px rgba(60,50,30,.14); }
  html[data-dark][data-btn-relief] button:not(:disabled):not([aria-pressed="true"]):not([role="tab"]):not([data-tab]):not(.tp-name):not([data-sidebar] *) { box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 1px 3px rgba(0,0,0,.45); }
  /* text fields of the side panels: rounded like the menus, with ONE thin border all round (the default relief border of the browser turns uneven on rounded corners) in the grey they had */
  [data-sidebar] input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]), [data-sidebar] textarea { border-radius:8px !important; border:1px solid var(--field-edge,#767676); }
  html[data-hc] [data-sidebar] input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]), html[data-hc] [data-sidebar] textarea { border:2px solid #fff; }
  /* STEPPERS (− value +): ONE look everywhere, the one of the reader settings of screen 3: compact buttons (24 px high at least, the minimum target of WCAG 2.5.8), the value as plain text between them */
  .stp { display:inline-flex; align-items:center; gap:var(--btn-gap,2px); }
  .stp > button, button.stp-b { min-width:0 !important; min-height:24px !important; width:auto !important; height:auto !important; padding:1px 6px !important; font-size:13.3333px !important; line-height:normal; }
  .stp-val, .stp > input.stepper-field { min-width:44px; width:auto; font-size:16px; text-align:center; font-variant-numeric:tabular-nums; }
  input.stepper-field.stp-val { width:3.2em; }
  /* the number of a stepper (− 10 +): plain text between the buttons, like the steppers of screen 3; it is still a field: a frame shows when the pointer is over it or when it has the focus */
  input.stepper-field { border:1px solid transparent !important; background:transparent !important; box-shadow:none; text-align:center; font-variant-numeric:tabular-nums; border-radius:8px !important; }
  input.stepper-field:hover { border-color:var(--edge,#bbb) !important; }
  input.stepper-field:focus, input.stepper-field:focus-visible { border-color:var(--ink-soft,#666) !important; background:var(--field,#fff) !important; }
  html[data-hc] input.stepper-field { border:2px solid #fff !important; }
  svg { display:block; }
  /* computers: the page header holds the transport and the drawer buttons: a little less air above, a little more below (before the score and the side bar) */
  body[data-pc-header] { padding-top:7px; }
  body[data-pc-header] .titlebar { align-items:center !important; margin-bottom:7px; }
  body[data-pc-header] .titlebar #stats, body[data-pc-header] .titlebar #layoutTime { min-width:0 !important; }
  body[data-pc-header] .titlebar h1 { line-height:1; margin-right:4px; }
  .caption { color:#6b6560; font-size:0.85rem; }
  .controls { display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--paper); border:1px solid var(--line);
              border-radius:10px; padding:12px 16px; margin-bottom:18px; font-size:0.85rem; }
  .controls label { display:flex; align-items:center; gap:8px; }
  .controls input[type=range] { width:220px; }
  .controls input[type=number] { width:64px; font:inherit; padding:2px 6px; }
/* every slider of the editor: the thin grey fader of the mixer (the vertical mixer faders add their own sizes) */
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; margin: 0; cursor: pointer; accent-color: #5a5750; }
input[type=range]::-webkit-slider-runnable-track { background: #c9c4b8; border-radius: 2px; height: 3px; }
input[type=range]::-moz-range-track { background: #c9c4b8; border-radius: 2px; height: 3px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: #5a5750; border: 0; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #5a5750; border: 0; }
input[type=range]:focus-visible { outline: 2px solid #2b6cff; outline-offset: 3px; border-radius: 4px; }
html[data-yt] #score-host { min-height: 0 !important; }
html[data-yt] [data-action="piano-toggle"], html[data-yt] [data-action="mixer-float"], html[data-yt] [data-action="percmap-float"] { display: none !important; }
/* a syllable of the score can be dragged onto another note: a finger that starts on it moves it instead of the page */
svg [data-role="lyric"] { touch-action: none; cursor: grab; }
</style>
</head>
<body>
<div id="app"></div>
<!--APP_SCRIPT-->
</body>
</html>
